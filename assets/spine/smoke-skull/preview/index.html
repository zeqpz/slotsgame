<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoke Skull · Spine 4.2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11151b;color:#eee;font:15px system-ui}main{display:grid;grid-template-columns:1fr 300px;min-height:100vh}.stage{position:relative;background:radial-gradient(ellipse at 50% 45%,#303842,#14191f 73%);display:flex;justify-content:center;align-items:center;overflow:hidden}canvas{display:block;max-width:100%;max-height:100vh}.tag{position:absolute;top:25px;left:28px;color:#a1b2bd;font-size:11px;letter-spacing:2px}aside{padding:36px 24px;border-left:1px solid #333c47}h1{font-size:28px;margin:8px 0}p{color:#a8b2bd;line-height:1.6}.label{color:#e9b967;letter-spacing:2px;font-size:10px}button,select{width:100%;padding:11px 13px;margin:4px 0;background:#202832;border:1px solid #3b4754;color:#f4f4f4;border-radius:7px;text-align:left;font:inherit;cursor:pointer}button.active{border-color:#e9b967;color:#e9b967}label{display:block;margin:18px 0;color:#bec8d1}input[type=range]{width:100%;accent-color:#e9b967}small{color:#758593;line-height:1.6}#status{font-size:12px;line-height:1.7;margin-top:24px;color:#8a9ba8}@media(max-width:700px){main{grid-template-columns:1fr}.stage{height:70vh}aside{padding:20px}canvas{max-height:70vh}}</style></head>
<body><main><div class="stage"><div class="tag">RUNTIME PREVIEW / SPINE 4.2</div><div id="canvas"></div></div><aside><div class="label">CHARACTER PACKAGE / 01</div><h1>Smoke Skull</h1><p>Original artwork.<br>Layered character motion and curling smoke.</p><div id="buttons"></div><label><input type="checkbox" id="smoke" checked> Animated smoke</label><label><input type="checkbox" id="rig"> Show bones and mesh</label><label>Playback speed <span id="rate">1×</span><input id="speed" type="range" min="0" max="2" step=".1" value="1"></label><button id="pause">Pause</button><label>Background<select id="bg"><option value="dark">Studio</option><option value="light">Light</option><option value="checker">Transparency check</option></select></label><div id="status">Loading local Spine runtime…</div><p><small>21 bones · 13 weighted meshes<br>9 animations · 2048px atlas<br>JSON + atlas + transparent PNG</small></p></aside></main>
<script src="pixi.min.js"></script><script src="spine-pixi-v8.min.js"></script><script src="asset-data.js"></script>
<script>
(async()=>{const app=new PIXI.Application();await app.init({width:900,height:1000,backgroundAlpha:0,antialias:true,resolution:1,preserveDrawingBuffer:true});document.querySelector('#canvas').appendChild(app.canvas);
const atlas=new spine.TextureAtlas(ASSET.atlas);for(const p of atlas.pages){const img=new Image();img.src=ASSET.pages[p.name];await img.decode();const tex=PIXI.Texture.from(img);p.setTexture(spine.SpineTexture.from(tex.source));}
const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(ASSET.json);const actor=new spine.Spine({skeletonData:data,autoUpdate:false});actor.scale.set(.59);actor.position.set(480,950);app.stage.addChild(actor);actor.state.data.defaultMix=.2;
let paused=false,speed=1,current='idle';const loops=new Set(['idle','anticipation']);
function effects(){if(document.querySelector('#smoke').checked){actor.state.setAnimation(1,'smoke_loop',true);actor.state.setAnimation(2,'ember_loop',true);}else{actor.state.clearTrack(1);actor.state.clearTrack(2);actor.skeleton.setSlotsToSetupPose();}}
function play(name){actor.state.clearTracks();actor.skeleton.setToSetupPose();current=name;actor.state.setAnimation(0,name,loops.has(name));if(name!=='exit')effects();if(!loops.has(name)&&name!=='exit')actor.state.addAnimation(0,'idle',true,0);document.querySelectorAll('[data-animation]').forEach(b=>b.classList.toggle('active',b.dataset.animation===name));document.querySelector('#status').textContent=name.replaceAll('_',' ')+' · '+(loops.has(name)?'loop':'one shot')+' | Spine runtime 4.2.120';}
for(const name of ['idle','anticipation','win','big_win','lose','ash_break','enter','exit']){let b=document.createElement('button');b.textContent=name.replaceAll('_',' ');b.dataset.animation=name;b.onclick=()=>play(name);document.querySelector('#buttons').appendChild(b);}document.querySelector('#buttons').style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:5px';document.querySelector('aside small').innerHTML=data.bones.length+' bones · 5 expressions<br>'+data.animations.length+' animations · '+atlas.pages.length+' atlas pages<br>Spine 4.2 JSON + atlas + PNG';
document.querySelector('#smoke').onchange=effects;document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#rate').textContent=speed+'×';};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause';};document.querySelector('#rig').onchange=e=>{actor.debug=e.target.checked?new spine.SpineDebugRenderer({drawBones:true,drawMeshHull:true,drawMeshTriangles:true}):undefined;};
document.querySelector('#bg').onchange=e=>{document.querySelector('.stage').style.background=e.target.value==='light'?'#dfe3e7':e.target.value==='checker'?'repeating-conic-gradient(#55606a 0% 25%,#414b55 0% 50%) 0/32px 32px':'radial-gradient(ellipse at 50% 45%,#303842,#14191f 73%)';};
app.ticker.add(t=>{if(!paused)actor.update(t.deltaMS/1000*speed);});play('idle');
window.preview={app,actor,data,play,seek(name,time,smoke=true){app.ticker.stop();actor.state.clearTracks();actor.skeleton.setToSetupPose();actor.state.setAnimation(0,name,false);if(smoke){actor.state.setAnimation(1,'smoke_loop',true);actor.state.setAnimation(2,'ember_loop',true);}actor.update(time);app.renderer.render(app.stage);},ready:true};
})().catch(e=>{document.querySelector('#status').textContent=e.stack;window.previewError=e.stack;console.error(e);});
</script></body></html>
